name: word-of-the-day

on:
  schedule:
    - cron: "*/15 * * * *"   # run every 15 min UTC, script filters to 09:00 UK
  workflow_dispatch:          # manual run still allowed

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET_HOUR_LONDON: "9"   # 09:00 UK
          TARGET_MINUTE_LONDON: "0"
        run: python3 word_of_the_day.py
