name: word-of-the-day

on:
  schedule:
    - cron: "*/15 * * * *"   # run every 15 min (UTC); script posts only at Mon 09:00 UK
  workflow_dispatch:
    inputs:
      force:
        description: "Post now (ignore time gate)"
        required: false
        default: "false"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TARGET_DAY_LONDON: "mon"   # mon,tue,wed,thu,fri,sat,sun
          TARGET_HOUR_LONDON: "9"    # 09:00 UK time
          TARGET_MINUTE_LONDON: "0"
          FORCE_POST: ${{ github.event.inputs.force }}
        run: python3 word_of_the_day.py
